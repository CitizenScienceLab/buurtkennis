            - { name: BU05460409, label: "Waardeiland (Roodenburgerdistrict)" }
            - { name: BU05460500, label: "Vreewijk (Bos- en Gasthuisdistrict)" }
            - { name: BU05460501, label: "Haagweg-Noord (Bos- en Gasthuisdistrict)" }
            - { name: BU05460502, label: "Gasthuiswijk (Bos- en Gasthuisdistrict)" }
            - { name: BU05460503, label: "Fortuinwijk-Noord (Bos- en Gasthuisdistrict)" }
            - { name: BU05460504, label: "Boshuizen (Bos- en Gasthuisdistrict)" }
            - { name: BU05460505, label: "Oostvliet (Bos- en Gasthuisdistrict)" }
