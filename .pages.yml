    label: Buurten
    type: collection
    path: _buurten
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: naam
      fields: [naam, fase, sinds]
      sort: [naam]
    fields:
      - { name: naam, label: Naam, type: string, required: true }
      - name: plek
        label: "Buurt op de kaart (CBS)"
        type: select
        required: true
        options:
