            - { name: BU05460401, label: "Rijndijkbuurt (Roodenburgerdistrict)" }
            - { name: BU05460402, label: "Professorenwijk-Oost (Roodenburgerdistrict)" }
            - { name: BU05460403, label: "Burgemeesterswijk (Roodenburgerdistrict)" }
