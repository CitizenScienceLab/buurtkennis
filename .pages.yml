      - name: stappen
        label: "Stappen (de gezette stappen; elke combinatie kan, ook zonder volgorde)"
        type: select
        options:
          multiple: true
          values:
            - { name: b1, label: "B1 · Oriënteren" }
            - { name: b2, label: "B2 · Ophalen kwesties" }
            - { name: b3, label: "B3 · Kwesties sorteren" }
            - { name: c1, label: "C1 · Werving betrokkenen" }
            - { name: c2, label: "C2 · Vraagstuk vormen" }
            - { name: d1, label: "D1 · Onderzoeken levensvatbaarheid" }
            - { name: d2, label: "D2 · Co-creatie initiatief" }
            - { name: e1, label: "E1 · Opstarten samenwerking" }
            - { name: e2, label: "E2 · Start onderzoek" }
      - name: fase
        label: "Fase (oud; telt alleen zolang Stappen leeg is)"
        type: select
        options:
          values:
            - { name: A, label: "A Project opstarten" }
            - { name: B, label: "B Kwesties verzamelen" }
            - { name: C, label: "C Vraagstuk vormen" }
            - { name: D, label: "D Samen plannen" }
            - { name: E, label: "E Onderzoek starten" }
            - { name: F, label: "F BuurtKennis delen" }
      - name: stap
        label: "Afslag (leeg laten zolang het loopt)"
        type: select
        options:
          values:
            - { name: geen-vervolg, label: "Geen vervolg" }
            - { name: doorverwezen, label: "Doorverwezen" }
      - { name: reden, label: "Reden van de afslag (optioneel)", type: text }
      - { name: naar, label: "Doorverwezen naar (optioneel, geen namen van personen)", type: string }
      - { name: sinds, label: "Sinds (jaar-maand, bv. 2026-09)", type: string, options: { pattern: "^[0-9]{4}-[0-9]{2}$" } }
      - { name: doel, label: Doel, type: text }
      - name: activiteiten
        label: Activiteiten
        type: object
        list: true
        fields:
          - { name: wat, label: Wat, type: string, required: true }
          - { name: wanneer, label: Wanneer, type: string }
          - { name: waar, label: Waar, type: string }
          - { name: wie, label: "Met wie (geen namen van personen)", type: string }
      - name: links
        label: Links
        type: object
        list: true
        fields:
          - { name: tekst, label: Tekst, type: string }
          - { name: url, label: URL, type: string }
      - { name: body, label: "Toelichting (optioneel)", type: rich-text }

  - name: trajecten
    label: Trajecten
    type: collection
    path: _trajecten
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: titel
      fields: [titel, stappen, thema, sinds]
      sort: [fase, titel]
    fields:
      - { name: titel, label: Titel, type: string, required: true }
      - name: stappen
        label: "Stappen (de gezette stappen; elke combinatie kan, ook zonder volgorde)"
        type: select
        options:
          multiple: true
          values:
            - { name: b1, label: "B1 · Oriënteren" }
            - { name: b2, label: "B2 · Ophalen kwesties" }
            - { name: b3, label: "B3 · Kwesties sorteren" }
            - { name: c1, label: "C1 · Werving betrokkenen" }
            - { name: c2, label: "C2 · Vraagstuk vormen" }
            - { name: d1, label: "D1 · Onderzoeken levensvatbaarheid" }
            - { name: d2, label: "D2 · Co-creatie initiatief" }
            - { name: e1, label: "E1 · Opstarten samenwerking" }
            - { name: e2, label: "E2 · Start onderzoek" }
      - name: fase
        label: "Fase (oud; telt alleen zolang Stappen leeg is)"
        type: select
        options:
          values:
            - { name: B, label: "B Kwesties verzamelen" }
            - { name: C, label: "C Vraagstuk vormen" }
            - { name: D, label: "D Samen plannen" }
            - { name: E, label: "E Onderzoek starten" }
      - name: stap
        label: "Afslag (leeg laten zolang het loopt)"
        type: select
        options:
          values:
            - { name: geen-vervolg, label: "Geen vervolg" }
            - { name: doorverwezen, label: "Doorverwezen" }
      - { name: reden, label: "Reden van de afslag (optioneel)", type: text }
      - { name: naar, label: "Doorverwezen naar (optioneel, geen namen van personen)", type: string }
      - name: thema
        label: Thema
        type: reference
        required: true
        options:
          collection: themapagina
          value: "{path}"
          label: "{naam}"
      - name: buurten
        label: Buurten
        type: reference
        required: true
        options:
          collection: buurten
          multiple: true
          min: 1
          value: "{path}"
          label: "{naam}"
      - { name: sinds, label: "Sinds (jaar-maand, bv. 2026-08)", type: string, options: { pattern: "^[0-9]{4}-[0-9]{2}$" } }
      - { name: doel, label: Doel, type: text }
      - name: activiteiten
        label: Activiteiten
        type: object
        list: true
        fields:
          - { name: wat, label: Wat, type: string, required: true }
          - { name: wanneer, label: Wanneer, type: string }
          - { name: waar, label: Waar, type: string }
          - { name: wie, label: "Met wie (geen namen van personen)", type: string }
      - name: links
        label: Links
        type: object
        list: true
        fields:
          - { name: tekst, label: Tekst, type: string }
          - { name: url, label: URL, type: string }
      - { name: body, label: "Toelichting (optioneel)", type: rich-text }

  - name: themapagina
    label: "Thema's"
    type: collection
    path: _themas
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: naam
      fields: [naam, volgorde]
      sort: [volgorde]
    fields:
      - { name: naam, label: Naam, type: string, required: true }
      - name: kleur
        label: Kleur
        type: select
        options:
          values:
            - { name: "#F28C28", label: "🟧 Oranje (#F28C28)" }
            - { name: "#D62728", label: "🟥 Rood (#D62728)" }
            - { name: "#D81B74", label: "🟥 Roze (#D81B74)" }
            - { name: "#F2E200", label: "🟨 Geel (#F2E200)" }
            - { name: "#3C7A2E", label: "🟩 Groen (#3C7A2E)" }
            - { name: "#9BBF4A", label: "🟩 Lichtgroen (#9BBF4A)" }
            - { name: "#5B8C5A", label: "🟩 Grijsgroen (#5B8C5A)" }
            - { name: "#9EC9E8", label: "🟦 Lichtblauw (#9EC9E8)" }
            - { name: "#1F3A66", label: "🟦 Donkerblauw (#1F3A66)" }
            - { name: "#6A3D9A", label: "🟪 Paars (#6A3D9A)" }
            - { name: "#8B5A2B", label: "🟫 Bruin (#8B5A2B)" }
            - { name: "#111111", label: "⬛ Zwart (#111111)" }
            - { name: "#444444", label: "⬛ Donkergrijs (#444444)" }
            - { name: "#C9C9C9", label: "⬜ Lichtgrijs (#C9C9C9)" }
      - { name: eigen_kleur, label: "Eigen kleur (optioneel, bv. #2A9D8F; gaat voor de lijst)", type: string, options: { pattern: "^(#[0-9A-Fa-f]{6})?$" } }
      - { name: sleutel, label: "Sleutel (niet wijzigen: oude trajecten verwijzen hiernaar)", type: string }
      - { name: volgorde, label: Volgorde, type: number }
      - { name: vraag, label: "Vraag als kop (leeg: alleen een tag, geen blok op de themapagina)", type: string }
      - { name: onderzoeksvragen, label: "Wat kun jij onderzoeken?", type: string, list: true }
      - { name: body, label: Tekst, type: rich-text }

  - name: home
    label: Homepagina
    type: file
    path: _data/home.yml
    format: yaml
    fields:
      - { name: kop, label: "Kop", type: string }
      - { name: kop_onder, label: "Kop, tweede regel", type: string }
      - { name: band, label: "Groene band", type: string }
      - { name: kwestiekaart, label: "Link naar de online kwestiekaart", type: string }
      - { name: contact_mail, label: "Contactadres", type: string }
      - { name: cta_kop, label: "Oproep op elke pagina: kop", type: string }
      - { name: cta_kop_onder, label: "Oproep op elke pagina: kop, tweede regel", type: string }
      - { name: cta_tekst, label: "Oproep op elke pagina: tekst", type: text }
      - { name: kwestie_knop, label: "Tekst op de knop naar de kwestiekaart", type: string }
      - name: stappen
        label: "Hoe het werkt: stappen"
        type: object
        list: true
        fields:
          - { name: fase, label: "Fase (kleur)", type: select, options: { values: [A, B, C, D, E, F] } }
          - { name: kop, label: Kop, type: string }
          - { name: tekst, label: Tekst, type: text }
      - { name: beleid_kop, label: "Van buurtgesprek naar beleid: kop", type: string }
      - { name: beleid_kop_onder, label: "Van buurtgesprek naar beleid: kop, tweede regel", type: string }
      - { name: beleid_tekst, label: "Van buurtgesprek naar beleid: tekst", type: text }
      - { name: themas_kop, label: "Thema's: kop", type: string }
      - { name: themas_kop_onder, label: "Thema's: kop, tweede regel", type: string }
      - { name: themas_tekst, label: "Thema's: tekst", type: text }
      - { name: themas_uitgelicht, label: "Thema's: uitgelicht (bestandsnamen uit _themas)", type: string, list: true }
      - { name: kaart_kop, label: "Kaart: kop", type: string }
      - { name: kaart_kop_onder, label: "Kaart: kop, tweede regel", type: string }
      - { name: kaart_tekst, label: "Kaart: tekst", type: text }
      - { name: doe_mee_tekst, label: "Doe mee: tekst", type: text }
      - name: rollen
        label: "Doe mee: rollen"
        type: object
        list: true
        fields:
          - { name: kop, label: Kop, type: string }
          - { name: tekst, label: Tekst, type: text }
      - { name: partners_tekst, label: "Partners: inleiding", type: text }
      - name: partners
        label: Partners
        type: object
        list: true
        fields:
          - { name: wie, label: Wie, type: string }
          - { name: wat, label: Wat, type: string }
      - { name: contact_tekst, label: "Contact", type: text }


  - name: methode
    label: De methode
    type: file
    path: _data/methode.yml
    format: yaml
    fields:
      - { name: handleiding, label: "Link naar de methode in GitBook", type: string }
      - name: pagina
        label: "Teksten op /methode/"
        type: object
        fields:
          - { name: kop, label: Kop, type: string }
          - { name: intro, label: Inleiding, type: text }
          - { name: figuur, label: "Uitleg bij de figuur (voordat je een stap kiest)", type: text }
          - { name: beslismoment, label: "Beslismoment (onder de stappen)", type: text }
          - { name: meer_kop, label: "Onderaan: kop", type: string }
          - { name: meer_tekst, label: "Onderaan: tekst", type: text }
      - name: fases
        label: "Fases en stappen (codes en kleuren niet veranderen)"
        type: object
        list: true
        fields:
          - { name: code, label: "Code (niet veranderen)", type: string }
          - { name: naam, label: Naam, type: string }
          - { name: beschrijving, label: "Korte uitleg van de fase", type: text }
          - { name: zichtbaar, label: "In de figuur (de ringen)", type: boolean, default: true }
          - { name: in_uitleg, label: "In de uitleg (de lijst onder de figuur)", type: boolean, default: true }
          - { name: doos, label: "Doosje (pad naar het plaatje)", type: string }
          - { name: kleur, label: "Kleur op /overzicht", type: string }
          - { name: kleur_donker, label: "Kleur op /overzicht, donker", type: string }
          - name: stappen
            label: Stappen
            type: object
            list: true
            fields:
              - { name: code, label: "Code (niet veranderen)", type: string }
              - { name: naam, label: Naam, type: string }
              - { name: kort, label: "Korte naam op de figuur", type: string }
              - { name: link, label: "Link naar GitBook", type: string }
              - name: verhaal
                label: "Uitleg op /methode/"
                type: object
                fields:
                  - { name: kop, label: Kop, type: string }
                  - { name: tekst, label: Tekst, type: text }
      - name: afslagen
        label: "Afslagen (codes niet veranderen)"
        type: object
        list: true
        fields:
          - { name: code, label: "Code (niet veranderen)", type: string }
          - { name: naam, label: Naam, type: string }
          - { name: kort, label: "Korte naam", type: string }

  - name: paginas
    label: Pagina's
    type: file
    path: _data/paginas.yml
    format: yaml
    fields:
      - name: themas
        label: "Thema's-pagina"
        type: object
        fields:
          - { name: kop, label: Kop, type: string }
          - { name: kop_onder, label: "Kop, tweede regel", type: string }
          - { name: intro, label: Inleiding, type: text }

  - name: instellingen
    label: Instellingen (kaart aan/uit)
    type: file
    path: _data/instellingen.yml
    format: yaml
    fields:
      - name: buurtkaart
        label: Nieuwe kaart op de startpagina
        type: select
        options: { values: [aan, uit] }
      - name: buurtenkaart
        label: Oude kaart op /overzicht
        type: select
        options: { values: [aan, uit] }
