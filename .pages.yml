# Beheerscherm voor Pages CMS (app.pagescms.org): log in met GitHub en kies deze repo.
# Alles wat je hier bewerkt wordt een gewone commit op main; de site bouwt vanzelf.
media:
  input: assets
  output: /assets

content:
  - name: buurten
    label: Buurten
    type: collection
    path: _buurten
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: naam
      fields: [naam, stappen, sinds]
      sort: [naam]
    fields:
      - { name: naam, label: Naam, type: string, required: true }
      - name: plek
        label: "Buurt op de kaart (CBS)"
        type: select
        required: true
        options:
          values:
            - { name: BU05460000, label: "Pieterswijk (Binnenstad-Zuid)" }
            - { name: BU05460001, label: "Academiewijk (Binnenstad-Zuid)" }
