            - { name: BU05460301, label: "Noorderkwartier (Leiden-Noord)" }
            - { name: BU05460302, label: "De Kooi (Leiden-Noord)" }
            - { name: BU05460400, label: "Meerburg (Roodenburgerdistrict)" }
            - { name: BU05460401, label: "Rijndijkbuurt (Roodenburgerdistrict)" }
            - { name: BU05460402, label: "Professorenwijk-Oost (Roodenburgerdistrict)" }
            - { name: BU05460403, label: "Burgemeesterswijk (Roodenburgerdistrict)" }
            - { name: BU05460404, label: "Professorenwijk-West (Roodenburgerdistrict)" }
