bovenaan:
  kop: Kennis van jouw buurt
  kop_onder: met jouw buurt
  band: Voor een **gezonde leefomgeving** in Leiden
hoe:
  kop: Van buurtvraag
  kop_onder: naar buurtkennis
  tekst: BuurtKennis brengt onderwerpen die bewoners belangrijk vinden in kaart.
    Samen met experts en de gemeente onderzoek je die zelf. Zo leren we hoe jouw
    buurt kan verbeteren en maken we van onze stad een gezonde plek om in te
    wonen.
  stappen:
    - fase: B
      kop: Verzamelen
      tekst: Buurtbewoners vertellen welke onderwerpen ze in hun buurt belangrijk
        vinden.
    - fase: C
      kop: Kiezen
      tekst: Samen met bewoners kijken we welke onderwerpen het meest geschikt zijn
        voor een buurtonderzoek
    - fase: D
      kop: Plannen
      tekst: Buurtbewoners, onderzoekers en de gemeente maken samen een aanpak die
        past bij de buurt en het onderwerp
    - fase: E
      kop: Onderzoeken
      tekst: Het buurtonderzoek gaat van start. Bewoners meten zelf, begeleid door
        BuurtKennis.
themas:
  kop: Wat zou jij willen
  kop_onder: onderzoeken?
  tekst: Bewoners bepalen zelf wat ze met Buurtkennis willen onderzoeken. Deze
    onderwerpen zijn tot nu toe genoemd in Leidse wijken.
  uitgelicht:
    - luchtkwaliteit
    - biodiversiteit
    - verkeersveiligheid
    - hittestress
    - lichtvervuiling
    - schoon-water
kaart:
  kop: Waar is
  kop_onder: BuurtKennis nu?
  tekst: "Op deze kaart zie je waar Buurtkennis al onderzoek doet, waar deze
    onderzoeken over gaan en in welke fase ze zitten. "
doe_mee:
  kop: Hoe maken we van jóuw buurt
  kop_onder: een gezonde omgeving?
  tekst: Onderzoek het! Er zijn veel manieren om mee te doen, van een uurtje
    meedenken tot zelf onderzoek doen in je eigen straat.
  rollen:
    - kop: Buurtbewoner
      tekst: Deel wat jij belangrijk vindt in je wijk. Kom naar een bijeenkomst, stel
        een onderwerp voor, of doe mee aan een meting.
    - kop: Lokale partner
      tekst: Buurthuis, wijkvereniging of initiatief in Leiden? We werken graag samen
        om de kwesties in jullie buurt in kaart te brengen.
    - kop: Student
      tekst: Werk mee aan echte wijkprojecten via Leren met de Stad. Of je nu studeert
        aan het MBO, HBO of aan de universiteit, BuurtKennis kan een project
        hebben dat bij je past.
partners:
  tekst: Leiden BuurtKennis is een project van het Citizen Science Lab van de
    Universiteit Leiden, samen met partners door de hele stad.
  lijst:
    - wie: Gemeente Leiden
      wat: beleid en stedelijke innovatie
    - wie: Universiteit Leiden, Hogeschool Leiden, MBO Rijnland, Leren met de Stad
      wat: (student)onderzoek en wijkprojecten
    - wie: Ideewinkel
      wat: netwerk om samenwerkingen te vinden
    - wie: Incluzio en Buzz
      wat: wijkgerichte samenwerking en uitvoering
    - wie: Energiek Leiden, Duurzaam Leiden, Netwerk Leiden Sneller Duurzaam
      wat: samenwerking met bewoners per thema
  contact: Een kwestie of onderzoek aanmelden kan via de online kwestiekaart. Voor
    andere vragen mail je naar Jordy Janssen via csl@leidenuniv.nl.
