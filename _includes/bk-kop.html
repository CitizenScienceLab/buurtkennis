{%- assign hier = page.url | remove: "index.html" -%}
<header class="bk-kop">
  <a class="logo" href="{{ '/' | relative_url }}" aria-label="Naar de homepagina"><img src="{{ '/assets/buurtkennis-logo.png' | relative_url }}" alt="BuurtKennis"></a>
  <a class="bk-titel" href="{{ '/' | relative_url }}">Leiden BuurtKennis</a>
  <nav class="bk-nav" aria-label="Pagina's">
    <a href="{{ '/themas/' | relative_url }}" {% if hier contains "/themas/" %}aria-current="page"{% endif %}>Thema's</a>
    <a href="{{ '/kaart/' | relative_url }}" {% if hier contains "/kaart/" or hier contains "/trajecten/" %}aria-current="page"{% endif %}>In kaart</a>
    <a href="{{ '/methode/' | relative_url }}" {% if hier contains "/methode/" %}aria-current="page"{% endif %}>De methode</a>
    <a class="doe-mee" href="{{ '/' | relative_url }}#doe-mee">Doe mee</a>
  </nav>
</header>
