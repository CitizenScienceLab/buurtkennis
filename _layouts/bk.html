<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: page.titel }}</title>
<meta name="description" content="{{ page.description | default: page.doel | default: 'BuurtKennis in Leiden: waar het loopt en hoe ver het is.' | escape }}">
<meta property="og:title" content="{{ page.title | default: page.titel | escape }}">
<meta property="og:description" content="{{ page.description | default: page.doel | default: 'BuurtKennis in Leiden: waar het loopt en hoe ver het is.' | escape }}">
<meta property="og:type" content="website">
<meta property="og:locale" content="nl_NL">
{%- if page.noindex %}<meta name="robots" content="noindex, nofollow">{% endif %}
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/bk-icoon-32.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/bk-icoon-180.png' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700&family=Figtree:wght@800;900&family=Open+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="{{ '/assets/bk.css' | relative_url }}">
</head>

<div class="wrap">
{% include bk-kop.html %}
{{ content }}
